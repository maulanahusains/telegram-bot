[project]
name = "telegram-bot-platform"
version = "1.0.0"
description = "A production-oriented modular monolith for hosting Telegram bots."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
telegram-platform = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

